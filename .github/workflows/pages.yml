# Publish the browser editor: node site/build.mjs wraps index.html into _site/, deployed with functions/
# (the /api/log error reports) to the Cloudflare Pages production branch.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID, and the
# repository variable CF_WEB_ANALYTICS_TOKEN for the Web Analytics beacon (optional).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - site/**
      - functions/**
      - wrangler.toml
      - vinyl-masks/**
      - docs/images/social-preview.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://recordmockup.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler 4 needs Node 22
      - run: node site/build.mjs
        env:
          SITE_RELEASE: ${{ github.sha }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4.148.0 pages deploy --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true

